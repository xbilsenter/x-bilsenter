<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Vedlikehold – X Bilsenter AS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #19ba60;
      --brand-dark: #14954d;
      --bg: #0c0c0c;
      --text: #ffffff;
      --text-muted: #a8a8a8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Barlow', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(25, 186, 96, 0.12), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(25, 186, 96, 0.08), transparent 40%),
        var(--bg);
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      width: min(560px, 100%);
    }

    .brand {
      display: block;
      line-height: 0;
    }

    .brand img {
      height: 48px;
      width: auto;
      display: block;
    }

    .panel {
      width: 100%;
      padding: 40px 32px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      background: rgba(22, 22, 22, 0.92);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(25, 186, 96, 0.15);
      color: var(--brand);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Chakra Petch', system-ui, sans-serif;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      line-height: 1.15;
      margin-bottom: 14px;
    }

    p {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .contact {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .contact a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }

    .contact a:hover { color: var(--brand-dark); }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/" aria-label="X Bilsenter AS">
      <img src="/assets/logo-white.svg" alt="X Bilsenter AS" width="154" height="47">
    </a>
    <main class="panel">
      <div class="badge">Vedlikehold</div>
      <h1>Vi er snart tilbake</h1>
      <p>{{MELDING}}</p>
      <div class="contact">
        Trenger du hjelp? Ring oss på
        <a href="tel:+4792050990">(+47) 920 50 990</a>
        eller send e-post til
        <a href="mailto:post@xbilsenter.no">post@xbilsenter.no</a>.
      </div>
    </main>
  </div>
</body>
</html>
